<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSV Color Picker</title>
  <meta name="description" content="HSV形式のカラーピッカー">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>HSV Color Picker</h1>

    <section class="picker" aria-label="カラーピッカー">
      <div id="sv" class="sv" role="slider" tabindex="0"
           aria-label="彩度と明度" aria-valuetext="">
        <div class="sv-white"></div>
        <div class="sv-black"></div>
        <div id="sv-thumb" class="sv-thumb"></div>
      </div>

      <div id="hue" class="hue" role="slider" tabindex="0"
           aria-label="色相" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
        <div id="hue-thumb" class="hue-thumb"></div>
      </div>
    </section>

    <section class="info">
      <div id="swatch" class="swatch" aria-hidden="true"></div>

      <div class="fields">
        <fieldset>
          <legend>HSV</legend>
          <label>H <input id="in-h" type="number" min="0" max="360" step="1"></label>
          <label>S <input id="in-s" type="number" min="0" max="100" step="1"></label>
          <label>V <input id="in-v" type="number" min="0" max="100" step="1"></label>
        </fieldset>

        <fieldset>
          <legend>RGB</legend>
          <label>R <input id="in-r" type="number" min="0" max="255" step="1"></label>
          <label>G <input id="in-g" type="number" min="0" max="255" step="1"></label>
          <label>B <input id="in-b" type="number" min="0" max="255" step="1"></label>
        </fieldset>

        <fieldset class="hex-row">
          <legend>HEX</legend>
          <input id="in-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off">
          <button id="copy" type="button">コピー</button>
        </fieldset>
      </div>
    </section>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
