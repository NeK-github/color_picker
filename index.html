<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Picker</title>
  <meta name="description" content="HSV / HSL / OKLCH (相対・絶対) 形式のカラーピッカー">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Color Picker</h1>
      <div class="mode-toggle" role="group" aria-label="カラーモデル">
        <button type="button" data-mode="hsv" aria-pressed="true">HSV</button>
        <button type="button" data-mode="hsl" aria-pressed="false">HSL</button>
        <button type="button" data-mode="oklch" aria-pressed="false"
                title="相対 OKLCH: 円盤の外周が常に sRGB 内の最大 Chroma">相対OKLCH</button>
        <button type="button" data-mode="oklch-abs" aria-pressed="false"
                title="絶対 OKLCH: 同心円が同じ Chroma、輪郭が sRGB ガマットの境界">絶対OKLCH</button>
      </div>
    </header>

    <section id="wheel" class="wheel" aria-label="カラーピッカー">
      <canvas id="ring-canvas"></canvas>
      <canvas id="shape-canvas"></canvas>
      <div id="hue-thumb" class="thumb hue-thumb" role="slider" tabindex="0"
           aria-label="色相" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></div>
      <div id="shape-thumb" class="thumb shape-thumb" role="slider" tabindex="0"
           aria-label="彩度と明度" aria-valuetext=""></div>
    </section>

    <div id="ok-controls" class="ok-controls" hidden>
      <div id="light-slider" class="light-slider" role="slider" tabindex="0"
           aria-label="Lightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="light-thumb" class="light-thumb"></div>
      </div>
      <button id="reset-chroma" type="button" class="secondary"
              title="Chroma を 0 (同じ Lightness のグレー) にする">C=0</button>
    </div>

    <section class="info">
      <div id="swatch" class="swatch" aria-hidden="true"></div>

      <div class="fields">
        <fieldset>
          <legend id="model-legend">HSV</legend>
          <label><span id="label-1">H</span> <input id="in-1" type="number" min="-1" max="360" step="1"></label>
          <label><span id="label-2">S</span> <input id="in-2" type="number" min="0" max="100" step="1"></label>
          <label><span id="label-3">V</span> <input id="in-3" type="number" min="0" max="100" step="1"></label>
        </fieldset>

        <fieldset>
          <legend>RGB</legend>
          <label>R <input id="in-r" type="number" min="0" max="255" step="1"></label>
          <label>G <input id="in-g" type="number" min="0" max="255" step="1"></label>
          <label>B <input id="in-b" type="number" min="0" max="255" step="1"></label>
        </fieldset>

        <fieldset class="hex-row">
          <legend>HEX</legend>
          <input id="in-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off">
          <button id="copy" type="button">コピー</button>
        </fieldset>

        <fieldset id="css-row" class="css-row" hidden>
          <legend>CSS</legend>
          <input id="out-css" type="text" readonly aria-label="CSS の oklch() 表記">
        </fieldset>
      </div>
    </section>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
